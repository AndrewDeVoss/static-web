<!doctype html>
<html lang="en-US">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5" />
  <title>RootWords</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="./rootwords.css" />
</head>

<body class="no-flex">
  <h1 class="header">Root Words</h1>
  <h3 class="subheader hidden" id="extra-text">Find words within words!</h3>

  <div class="drawn-wrapper">
    <div id="over-world">
      <div id="tree"></div>
      <div id="grassery"></div>
    </div>
    <div class="root-container">
      <div id="word-grid"></div>
    </div>
  </div>

  <div id="letter-board"></div>

  <!-- Bottom Navigation Banner -->
  <div class="bottom-banner">
    <!-- Always visible game controls -->
    <div class="game-controls">
      <div id="undo-button" title="Undo">↩️</div>

      <div class="score-box">
        <div id="current-score">0</div>
        <div id="best-score" class="side-score-box">0</div>
      </div>

      <div id="redo-button" title="Redo">↪️</div>
      <div id="shuffle-button" title="Shuffle">🔀</div>

      <!-- Twirl toggle button -->
      <div id="toggle-nav" title="More">▴</div>
    </div>

    <!-- Hidden navigation controls -->
    <div class="nav-controls hidden" id="nav-controls">
      <a href="../index.html" id="home-button" title="Home">🏠</a>
      <div class="score-box">
        <div id="bronze-score" class="side-score-box">999</div>
        <div id="silver-score" class="side-score-box">999</div>
        <div id="gold-score" class="side-score-box">999</div>
        <div id="opal-score" class="side-score-box">999</div>
      </div>
      <a class="disabled" id="stats-button" title="Stats">📊</a>
      <div id="help-button" title="Help">⚙️</div>
    </div>
  </div>


  <!-- Settings Overlay -->
  <div id="settings-overlay" class="hidden">
    <div id="settings-panel">
      <h2>Settings</h2>

      <label class="setting-item">
        <span class="title">Hints</span>
        <span class="desc">These hints are designed to give you ideas, but do not necessarily lead to the optimal
          solution.</span>
        <br />

        <label>
          <input id="hint-anagrams" type="checkbox">
          Anagrams
          <span class="desc">- Highlight all available letters if a word can be formed using all of them</span>
        </label>

        <label>
          <input id="hint-powerful-combination" type="checkbox">
          Powerful Combination
          <span class="desc">- Highlight the strict subset of available letters that has the highest scoring set of
            anagrams among all strict subsets</span>
        </label>

        <label class="coming-soon">
          <input id="hint-greedy" type="checkbox">
          Greedy
          <span class="desc">- Highlight all available letters contained in the longest possible next word</span>
        </label>
      </label>

      <label class="setting-item">
        <span class="title">Scoring Mode</span>

        <div class="radio-group">
          <label>
            <input type="radio" name="mode" value="classic" checked>
            Classic
            <span class="desc">- One point for every letter used</span>
          </label>

          <label class="coming-soon">
            <input type="radio" name="mode" value="softened">
            Softened
            <span class="desc">- One point for every word used</span>
          </label>

          <label class="coming-soon">
            <input type="radio" name="mode" value="weighted">
            Weighted
            <span class="desc">- Varied points for each letter</span>
          </label>
        </div>
      </label>

      <label class="setting-item">
        <span class="title">Extra Features</span>
        <span class="desc">Just wish you could ... ?</span>
        <br />

        <label>
          <input id="extras-dictionary" type="checkbox">
          Dictionary
          <span class="desc">- Define the selected word</span>
          <br />
          <span class="desc">
            Definitions provided by
            <br />
            WordNet 3.0 © 2006 Princeton University.
            <br />
            and
            <br />
            Tatu Ylonen: Wiktextract: Wiktionary as Machine-Readable Structured Data, Proceedings of the 13th Conference
            on Language Resources and Evaluation (LREC), pp. 1317-1325, Marseille, 20-25 June 2022. ttps://kaikki.org
          </span>"
        </label>
      </label>

      <button id="close-settings">Close</button>
    </div>
  </div>


  <script type="module" src="../utility/letterboard/wordswiper.js"></script>
  <script type="module" src="../utility/letterboard/hexboard.js"></script>
  <script type="module" src="./drawtree.js"></script>
  <script type="module" src="./rootwords.js"></script>
</body>

</html>
