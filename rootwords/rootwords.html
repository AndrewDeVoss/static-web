<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>RootWords</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="./rootwords.css" />
  </head>
  <body class="no-flex">
    <h1 class="header">RootWords</h1>
    
    <div class="drawn-wrapper">
      <div id="over-world">
        <div id="celestial"></div>
        <div id="tree"></div>
        <div id="grassery"></div>
      </div>
      <div class="root-container">
        <div id="word-grid"></div>
      </div>
    </div>
  
    <word-swiper id="word-swiper" letters="XOXOXOXOXO"></word-swiper>

    <!-- Bottom Navigation Banner -->
    <div class="bottom-banner">
      <div class="nav-controls">
        <a href="../index.html" class="root-words-home-button" title="Home">🏠</a>

        <div class="score-box">
          <div class="score-scroll" id="score-scroll">0</div>
        </div>

        <div class="root-words-shuffle-button" title="Shuffle">🔀</div>
        <div class="root-words-help-button" title="Help">❓</div>
      </div>
    </div>

    <script type="module" src="../utility/wordswiper/wordswiper.js"></script>
    <script type="module" src="./drawtree.js"></script>
    <script type="module" src="./rootwords.js"></script>
  </body>
</html>
