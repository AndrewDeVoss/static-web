<!doctype html>
<html lang="en-US">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5"/>
  <title>RootWords</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="./rootwords.css" />
</head>

<body class="no-flex">
  <h1 class="header">RootWords</h1>

  <div class="drawn-wrapper">
    <div id="over-world">
      <div id="tree"></div>
      <div id="grassery"></div>
    </div>
    <div class="root-container">
      <div id="word-grid"></div>
    </div>
  </div>

  <div id="letter-board"></div>

  <!-- Bottom Navigation Banner -->
  <div class="bottom-banner">
    <!-- Always visible game controls -->
    <div class="game-controls">
      <div id="undo-button" title="Undo">↩️</div>

      <div class="score-box">
        <div id="current-score">0</div>
        <div id="best-score" class="side-score-box">0</div>
      </div>

      <div id="redo-button" title="Redo">↪️</div>
      <div id="shuffle-button" title="Shuffle">🔀</div>

      <!-- Twirl toggle button -->
      <div id="toggle-nav" title="More">▴</div>
    </div>

    <!-- Hidden navigation controls -->
    <div class="nav-controls hidden" id="nav-controls">
      <a href="../index.html" id="home-button" title="Home">🏠</a>
      <div class="score-box">
        <div id="bronze-score" class="side-score-box">999</div>
        <div id="silver-score" class="side-score-box">999</div>
        <div id="gold-score" class="side-score-box">999</div>
        <div id="opal-score" class="side-score-box">999</div>
      </div>
      <a class="disabled" id="stats-button" title="Stats">📊</a>
      <div class="disabled" id="help-button" title="Help">❓</div>
    </div>
  </div>


  <script type="module" src="../utility/letterboard/wordswiper.js"></script>
  <script type="module" src="../utility/letterboard/hexboard.js"></script>
  <script type="module" src="./drawtree.js"></script>
  <script type="module" src="./rootwords.js"></script>
</body>

</html>
