<!doctype html>
<html lang="en-US">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Turn of Phrase</title>

    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="./turn-of-phrase.css" />
</head>

<body class="no-flex">
    <h1 class="header">Turn of Phrase</h1>

    <div class="root-container">
        <div class="difficulty-panel">
            <div class="difficulty-card" data-difficulty="easy">
                <div class="title">Easy</div>
                <div class="difficulty-label">5 × 5</div>
                <div class="day-selector" data-difficulty="easy"></div>
            </div>

            <div class="difficulty-card" data-difficulty="medium">
                <div class="title">Medium</div>
                <div class="difficulty-label">6 × 5</div>
                <div class="day-selector" data-difficulty="easy"></div>

            </div>

            <div class="difficulty-card" data-difficulty="hard">
                <div class="title">Hard</div>
                <div class="difficulty-label">6 × 6</div>
                <div class="day-selector" data-difficulty="easy"></div>

            </div>

            <div class="difficulty-card" data-difficulty="custom">
                <div class="title">Custom</div>
                <div class="difficulty-label">? × ?</div>
                <div class="difficulty-label">Play at your own pace.</div>
            </div>

        </div>
    </div>

    <div class="bottom-banner">
        <div class="game-controls">
            <div id="home-button"><a href="../index.html">🏠</a></div>
        </div>
    </div>

    <script type="module" src="./turn-of-phrase-landing.js"></script>
</body>

</html>
