<!doctype html>
<html lang="en-US">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5" />
    <title>Turn of Phrase</title>

    <!-- Assuming your main style.css exists one level up like RootWords -->
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="./turn-of-phrase.css" />
</head>

<body class="no-flex">
    <h1 class="header">Turn of Phrase</h1>
    
    <div class="subheader">
        <span class="subheader-text"></span>
        <button class="subheader-close" aria-label="Dismiss subheader">×</button>
    </div>

    <div class="root-container">
        <div class="control-panel">
            <div class="control-group">
                <label for="grid-width">Width</label>
                <input type="number" id="grid-width" min="3" max="6" value="4" />
            </div>

            <div class="control-group">
                <label for="grid-height">Height</label>
                <input type="number" id="grid-height" min="3" max="6" value="4" />
            </div>

            <button id="generate-btn" class="primary-btn">Generate Grid</button>
        </div>

        <div class="game-area">
            <div id="bank-container">
                <div id="bank"></div>
            </div>

            <div id="board-container">
                <div id="board" class="board"></div>
            </div>
        </div>
    </div>

    <div class="bottom-banner">
        <div class="game-controls">
            <div id="back-button"><a href="./turn-of-phrase-landing.html">◀</a></div>
        </div>
    </div>

    <script src="./turn-of-phrase.js" type="module"></script>
</body>

</html>
